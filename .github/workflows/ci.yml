name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v7.0.0
      - name: Toolchain
        run: swift --version
      - name: Resolve exact dependencies
        run: swift package resolve
      - name: Test
        run: swift test
      - name: Build ad-hoc app
        run: scripts/build-app.sh --adhoc
      - name: Verify packaged executables
        run: |
          scripts/verify-release.sh "dist/Codex Habitat.app"
          "dist/Codex Habitat.app/Contents/MacOS/CodexHabitatApp" --version
          "dist/Codex Habitat.app/Contents/Helpers/CodexHabitatThemeBridge" --version
